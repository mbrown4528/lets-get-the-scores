<style>
  :root {
    --velvet: #2A0E2E;
    --velvet-2: #4A1A4C;
    --gold: #E8C36A;
    --gold-deep: #B8872E;
    --ivory: #FFF8EC;
    --ink: #2A0E2E;
    --display: "Limelight", "Didot", "Bodoni 72", Georgia, serif;
    --ui: "Jost", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; margin: 0; }
  html, body { height: 100%; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    font-family: var(--ui);
    color: var(--ivory);
    background: transparent;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  /* Background layer sized to the full screen, including the area behind Safari's bars */
  html { background: #F8F6F2; min-height: calc(100% + env(safe-area-inset-top, 0px)); }
  body::before {
    content: ""; position: fixed; left: 0; right: 0; top: 0;
    /* Extra status-bar height covers an iPhone home-screen quirk that leaves a gap at the bottom */
    height: calc(100vh + env(safe-area-inset-top, 0px) + env(safe-area-inset-bottom, 0px));
    height: calc(100lvh + env(safe-area-inset-top, 0px) + env(safe-area-inset-bottom, 0px));
    z-index: -1; pointer-events: none;
    background:
      radial-gradient(ellipse 120% 60% at 50% -10%, #6B2A63 0%, transparent 60%),
      radial-gradient(ellipse 80% 50% at 50% 110%, #3E1540 0%, transparent 70%);
  }
  /* Home screen app mode on iPhone: the page is measured without the status bar,
     leaving a gap at the bottom. Stretch everything by that amount. */
  @media (display-mode: standalone) {
    html, body { height: calc(100% + env(safe-area-inset-top, 0px)); }
    body::before { height: calc(100lvh + env(safe-area-inset-top, 0px)); }
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

  .screen {
    position: absolute; inset: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 20px) 20px calc(env(safe-area-inset-bottom, 0px) + 20px);
    display: flex; flex-direction: column; align-items: center;
  }
  .hidden { display: none !important; }

  /* ---------- Pick screen ---------- */
  #pick { justify-content: center; gap: 22px; overflow-y: auto; }
  .title {
    font-family: var(--display); font-weight: 400;
    font-size: clamp(3rem, 14vw, 4.6rem); line-height: 1; text-align: center;
    color: #3B0F4A;
  }
  .sub { font-size: 1.05rem; color: #3B0F4A; opacity: .8; text-align: center; margin-top: 10px; letter-spacing: .02em; }

  .grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    width: 100%; max-width: 420px;
  }
  .score-btn {
    aspect-ratio: 5 / 4; border-radius: 16px 16px 26px 26px;
    background: linear-gradient(170deg, var(--ivory), #F1E2C4);
    color: var(--ink);
    font-family: var(--display); font-weight: 400; font-size: clamp(2.2rem, 11vw, 3rem);
    box-shadow: 0 3px 0 var(--gold-deep), 0 8px 18px rgba(0,0,0,.35);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .score-btn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--gold-deep), 0 4px 10px rgba(0,0,0,.35); }
  .score-btn[data-score="10"] {
    grid-column: 1 / -1; aspect-ratio: auto; height: clamp(64px, 11vh, 96px);
    background: linear-gradient(160deg, #F7DE94, var(--gold) 45%, #D9A847);
  }
  .hint { font-size: .85rem; color: #3B0F4A; opacity: .6; text-align: center; }

  /* ---------- Paddle screen ---------- */
  #show { justify-content: center; }
  .paddle-wrap {
    display: flex; flex-direction: column; align-items: center;
    height: 100%; width: 100%; max-width: 560px; justify-content: space-between;
  }
  .paddle-stage { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; padding-bottom: 12vh; }
  .paddle {
    position: relative;
    width: min(96vw, 72vh);
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background: var(--paddle-bg, var(--ivory));
    color: var(--paddle-ink, var(--ink));
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: inset 0 0 0 6px var(--gold), inset 0 0 0 8px var(--gold-deep),
                0 20px 50px rgba(0,0,0,.5);
    animation: raise .45s cubic-bezier(.2,1.4,.4,1) both;
  }
  .paddle::after {
    content: ""; position: absolute; left: 50%; bottom: -11vh;
    width: 9%; height: 12vh; transform: translateX(-50%);
    background: linear-gradient(90deg, #7A4A1C, #B07A3C 45%, #6A3E15);
    border-radius: 0 0 10px 10px; z-index: -1;
  }
  .number {
    font-family: Georgia, "Times New Roman", serif; font-weight: 700;
    font-size: min(78vw, 48vh); line-height: .8;
    letter-spacing: -0.02em;
  }
  .number-art { position: absolute; inset: 0; width: 100%; height: 100%; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .paddle.ten .number { font-size: min(60vw, 37vh); }
  .back {
    margin: 0 0 8px;
    padding: 14px 30px; border-radius: 999px;
    background: linear-gradient(170deg, #F7DE94, var(--gold) 50%, #D2A043);
    color: var(--velvet);
    font-weight: 600; font-size: 1.05rem;
    box-shadow: 0 3px 0 var(--gold-deep), 0 8px 20px rgba(0,0,0,.45);
  }
  .back:active { transform: translateY(3px); box-shadow: 0 0 0 var(--gold-deep), 0 4px 10px rgba(0,0,0,.45); }

  /* one standard paddle for every score */
  .paddle {
    --paddle-bg: radial-gradient(circle at 50% 35%, #5C1F5E, #22082A 75%);
    --paddle-ink: #FFFDF8;
  }

  @keyframes raise {
    from { transform: translateY(40vh) rotate(-6deg); }
    to   { transform: translateY(0) rotate(0); }
  }

  /* sparkles for a 10 */
  .spark {
    position: fixed; width: 10px; height: 10px; pointer-events: none;
    background: var(--gold);
    clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translate(var(--dx), 110vh) rotate(540deg); opacity: .2; }
  }


  /* ---------- Disco balls ---------- */
  .discos { position: absolute; top: 0; left: 0; right: 0; height: 0; pointer-events: none; }
  .disco {
    position: absolute; top: 0; display: flex; flex-direction: column; align-items: center;
    transform-origin: top center; animation: sway 4s ease-in-out infinite alternate;
  }
  .disco .string { width: 1.5px; background: linear-gradient(rgba(232,195,106,.2), rgba(232,195,106,.8)); }
  .disco svg { display: block; filter: drop-shadow(0 6px 14px rgba(0,0,0,.45)); }
  .disco .glint { animation: glint 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; opacity: 0; }
  .d1 { left: 8%;  animation-duration: 4.2s; }
  .d2 { left: 30%; animation-duration: 5s; animation-delay: -1.5s; }
  .d3 { right: 28%; animation-duration: 4.6s; animation-delay: -.8s; }
  .d4 { right: 7%; animation-duration: 3.8s; animation-delay: -2.2s; }
  @keyframes sway { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
  .tw { animation: twinkle 2s ease-in-out infinite alternate; }
  @keyframes twinkle { 0% { opacity: .15; } 60% { opacity: .55; } 100% { opacity: 1; } }
  .disco svg { overflow: visible; }
  @keyframes glint { 0%, 70%, 100% { opacity: 0; transform: scale(.4); } 80% { opacity: 1; transform: scale(1); } }
  #pick { z-index: 0; }
  #pick > *:not(.discos) { position: relative; z-index: 1; }
  .heading { margin-top: 172px; }
  @media (max-height: 640px) { .d2, .d3 { display: none; } .heading { margin-top: 140px; } }

  @media (prefers-reduced-motion: reduce) {
    .disco, .disco .glint, .tw { animation: none; }
    .paddle { animation: none; }
    .spark { display: none; }
    .score-btn { transition: none; }
  }
  @media (max-height: 700px) {
    .hint { display: none; }
    #pick { gap: 16px; }
    .score-btn { aspect-ratio: 16 / 10; }
  }
  @media (max-height: 560px) {
    .grid { max-width: 640px; grid-template-columns: repeat(10, 1fr); }
    .score-btn, .score-btn[data-score="10"] { grid-column: auto; aspect-ratio: 3 / 4; height: auto; font-size: 1.6rem; }
  }
</style>
</head>
<body>

          <rect class="tw" x="18" y="54" width="9" height="9" fill="#F7DE94" style="animation-delay:-0.24s;animation-duration:2.21s"/>

          <rect class="tw" x="72" y="54" width="9" height="9" fill="#FFFFFF" style="animation-delay:-0.45s;animation-duration:1.72s"/>
          <rect class="tw" x="81" y="54" width="9" height="9" fill="#FFFFFF" style="animation-delay:-0.04s;animation-duration:2.9s"/>
          <rect class="tw" x="9" y="63" width="9" height="9" fill="#FFFFFF" style="animation-delay:-0.01s;animation-duration:2.15s"/>
          <rect class="tw" x="18" y="63" width="9" height="9" fill="#E9B8E6" style="animation-delay:-0.96s;animation-duration:1.63s"/>

          <rect class="tw" x="45" y="72" width="9" height="9" fill="#FFFFFF" style="animation-delay:-2.95s;animation-duration:2.19s"/>
          <rect class="tw" x="54" y="72" width="9" height="9" fill="#E9B8E6" style="animation-delay:-0.16s;animation-duration:1.4s"/>
          <rect class="tw" x="63" y="72" width="9" height="9" fill="#FFFFFF" style="animation-delay:-2.85s;animation-duration:2.5s"/>
          <rect class="tw" x="72" y="72" width="9" height="9" fill="#FFFFFF" style="animation-delay:-1.84s;animation-duration:1.67s"/>
          <rect class="tw" x="27" y="81" width="9" height="9" fill="#FFFFFF" style="animation-delay:-1.81s;animation-duration:2.25s"/>

          <rect class="tw" x="54" y="81" width="9" height="9" fill="#FFFFFF" style="animation-delay:-2.25s;animation-duration:2.73s"/>
        </g>
        <ellipse cx="34" cy="30" rx="16" ry="11" fill="#fff" opacity=".35"/>
        <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="1.5"/>

  </svg>
  <div class="discos" aria-hidden="true">
    <div class="disco d1"><div class="string" style="height:calc(30px + env(safe-area-inset-top, 0px))"></div>

        <g transform="translate(44 72)"><g class="glint" style="animation-delay:1.6s"><path d="M0 -13 L3 -3 L13 0 L3 3 L0 13 L-3 3 L-13 0 L-3 -3 Z" fill="#fff"/></g></g>

        <g transform="translate(66 70)"><g class="glint" style="animation-delay:1.9s"><path d="M0 -13 L3 -3 L13 0 L3 3 L0 13 L-3 3 L-13 0 L-3 -3 Z" fill="#fff"/></g></g>

      <svg width="52" height="52" viewBox="0 0 100 100" aria-hidden="true">
        <use href="#ball"/>
        <g transform="translate(36 40)"><g class="glint" style="animation-delay:0.5s"><path d="M0 -13 L3 -3 L13 0 L3 3 L0 13 L-3 3 L-13 0 L-3 -3 Z" fill="#fff"/></g></g>
        <g transform="translate(70 34)"><g class="glint" style="animation-delay:1.3s"><path d="M0 -13 L3 -3 L13 0 L3 3 L0 13 L-3 3 L-13 0 L-3 -3 Z" fill="#fff"/></g></g>
        <g transform="translate(52 74)"><g class="glint" style="animation-delay:2.1s"><path d="M0 -13 L3 -3 L13 0 L3 3 L0 13 L-3 3 L-13 0 L-3 -3 Z" fill="#fff"/></g></g>
      </svg></div>
    <div class="disco d4"><div class="string" style="height:calc(44px + env(safe-area-inset-top, 0px))"></div>
      <svg width="40" height="40" viewBox="0 0 100 100" aria-hidden="true">
        <use href="#ball"/>
        <g transform="translate(28 60)"><g class="glint" style="animation-delay:0.2s"><path d="M0 -13 L3 -3 L13 0 L3 3 L0 13 L-3 3 L-13 0 L-3 -3 Z" fill="#fff"/></g></g>
        <g transform="translate(60 26)"><g class="glint" style="animation-delay:1.0s"><path d="M0 -13 L3 -3 L13 0 L3 3 L0 13 L-3 3 L-13 0 L-3 -3 Z" fill="#fff"/></g></g>

<main id="show" class="screen hidden" aria-live="polite">
  <div class="paddle-wrap">
    <div class="paddle-stage">
    <div class="paddle" id="paddle">
      <canvas class="number-art" id="numberArt" aria-hidden="true"></canvas>
      <div class="number sr-only" id="number">10</div>
    </div>
    </div>
    <button class="back" id="back">Score the next dance</button>
  </div>
</main>

<script>
(function () {
  const pick = document.getElementById('pick');
  const show = document.getElementById('show');
  const paddle = document.getElementById('paddle');
  const number = document.getElementById('number');
  let wakeLock = null;

  // Keep the screen awake while a score is up (where supported)
  async function keepAwake() {
    try {
      if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    } catch (e) {}
  }
  function releaseAwake() {
    try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {}
  }

  function sparkle() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    for (let i = 0; i < 40; i++) {
      const s = document.createElement('div');
      s.className = 'spark';
      const size = 6 + Math.random() * 12;
      s.style.width = s.style.height = size + 'px';
      s.style.left = Math.random() * 100 + 'vw';
      s.style.top = (-10 - Math.random() * 30) + 'vh';
      s.style.setProperty('--dx', (Math.random() * 80 - 40) + 'px');
      s.style.animationDuration = (1.8 + Math.random() * 1.6) + 's';
      s.style.animationDelay = (Math.random() * 0.5) + 's';
      if (Math.random() > .6) s.style.background = '#FFF8EC';
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 4200);
    }
  }

  // Draw the number on the paddle, centered by the actual shape of the digits
  const art = document.getElementById('numberArt');
  const NUMBER_FONT = 'Georgia, "Times New Roman", serif';
  let current = null;
  function drawNumber(n) {
    const size = paddle.clientWidth;
    if (!size) return;
    const dpr = window.devicePixelRatio || 1;
    art.width = Math.round(size * dpr);
    art.height = Math.round(size * dpr);
    const ctx = art.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, size, size);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';

    // Size each number so it fills the paddle to the same height,
    // as large as it can go while staying inside the gold rim
    const text = String(n);
    let fontPx = size;
    ctx.font = '700 ' + fontPx + 'px ' + NUMBER_FONT;
    let m = ctx.measureText(text);
    const h = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
    const w = m.actualBoundingBoxLeft + m.actualBoundingBoxRight;
    const fit = Math.min((size * 0.68) / h, (size * 0.86) / Math.hypot(w, h));
    fontPx = fontPx * fit;
    ctx.font = '700 ' + fontPx + 'px ' + NUMBER_FONT;
    m = ctx.measureText(text);

    // Small optical nudges for digits whose weight sits off to one side
    const NUDGE = { '4': -0.03 };
    const x = size / 2 - (m.actualBoundingBoxRight - m.actualBoundingBoxLeft) / 2 + (NUDGE[text] || 0) * size;
    const y = size / 2 + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
    ctx.fillStyle = '#FFFDF8';
    ctx.fillText(text, x, y);
  }
  window.addEventListener('resize', () => { if (current !== null) drawNumber(current); });

  function raise(n) {
    current = n;
    number.textContent = n;
    paddle.className = 'paddle' + (n === 10 ? ' ten' : '');
    // restart the raise animation
    void paddle.offsetWidth;
    pick.classList.add('hidden');
    show.classList.remove('hidden');
    drawNumber(n);
    if (navigator.vibrate) navigator.vibrate(n === 10 ? [40, 60, 40] : 30);
    if (n === 10) sparkle();
    keepAwake();
    document.getElementById('back').focus({ preventScroll: true });
  }

  function lower() {
    current = null;
    show.classList.add('hidden');
    pick.classList.remove('hidden');
    releaseAwake();
  }

  document.querySelectorAll('.score-btn').forEach(btn => {
    btn.addEventListener('click', () => raise(parseInt(btn.dataset.score, 10)));
  });
  document.getElementById('back').addEventListener('click', lower);
  paddle.addEventListener('click', lower);
})();
</script>
</body>
</html>
